<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dune Combat Calculator</title>
<style>
  :root {
    --bg: #1a1510;
    --surface: #2a2218;
    --surface2: #3a3020;
    --amber: #d4a843;
    --amber-dim: #8a7030;
    --sand: #c4a060;
    --text: #e8dcc8;
    --text-dim: #9a8a70;
    --danger: #c45040;
    --success: #6a9a50;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: var(--amber);
    font-size: 1.6rem;
    margin-bottom: 24px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .layout {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 24px;
    row-gap: 0;
    align-items: stretch;
  }
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
  }
  .cell {
    background: var(--surface);
    border-left: 1px solid var(--surface2);
    border-right: 1px solid var(--surface2);
    border-bottom: 1px solid var(--surface2);
    padding: 16px 20px;
  }
  .cell-header {
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 12px 20px;
    color: var(--amber);
    font-size: 1rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .cell-last {
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .cell > select, .field select, .field input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 0.95rem;
  }
  .cell > select:focus, .field select:focus, .field input:focus {
    outline: none;
    border-color: var(--amber);
  }
  .field input[type="number"] { width: 100px; }
  .elite-row, .committed-row {
    display: flex;
    gap: 12px;
  }
  .elite-row .field, .committed-row .field { flex: 1; }
  .hidden { display: none !important; }

  /* Output styles */
  .strength-value {
    font-size: 2rem;
    font-weight: bold;
    color: var(--amber);
    text-align: center;
    padding: 12px;
    background: var(--bg);
    border-radius: var(--radius);
    margin-bottom: 16px;
  }
  .combo-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .combo-table th {
    text-align: left;
    color: var(--amber-dim);
    font-weight: normal;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--surface2);
  }
  .combo-table .group-header {
    color: var(--amber);
    font-size: 0.7rem;
    font-weight: 600;
    border-bottom: none;
    padding-top: 8px;
    padding-bottom: 4px;
  }
  .combo-table .subheader {
    border-bottom: 1px solid var(--surface2);
  }
  .combo-table td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--surface2);
  }
  .combo-table tr:last-child td { border-bottom: none; }
  .combo-table td.strength {
    text-align: center;
    font-weight: bold;
    color: var(--amber);
  }
  .reminder {
    padding: 10px 12px;
    border-radius: var(--radius);
    margin-bottom: 8px;
    font-size: 0.85rem;
    line-height: 1.4;
  }
  .reminder-ally {
    background: rgba(106, 154, 80, 0.15);
    border-left: 3px solid var(--success);
  }
  .reminder-threat {
    background: rgba(196, 80, 64, 0.15);
    border-left: 3px solid var(--danger);
  }
  .reminder-title {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .section-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
    margin-top: 12px;
  }
  .input-section-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--amber);
    margin-bottom: 12px;
    font-weight: 600;
  }
  .remaining-simple {
    font-size: 1.3rem;
    color: var(--sand);
    padding: 8px 12px;
    background: var(--bg);
    border-radius: var(--radius);
    margin-bottom: 16px;
    text-align: center;
  }
  .leader-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .leader-btn {
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 0.82rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    line-height: 1.3;
  }
  .leader-btn:hover {
    border-color: var(--amber-dim);
    color: var(--text);
  }
  .leader-btn.selected {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(212, 168, 67, 0.12);
  }
  .leader-btn .lstr {
    font-weight: bold;
    opacity: 0.8;
  }
  .leader-btn.unavailable {
    text-decoration: line-through;
    opacity: 0.35;
  }
  .leader-btn.unavailable:hover {
    opacity: 0.6;
    border-color: var(--surface2);
  }
  .opp-range {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    font-size: 1.8rem;
    font-weight: bold;
    color: var(--danger);
    padding: 12px;
    background: var(--bg);
    border-radius: var(--radius);
    margin-bottom: 8px;
  }
  .opp-range .range-sep {
    color: var(--text-dim);
    font-size: 1.2rem;
  }
  .opp-range-detail {
    font-size: 0.8rem;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<h1>Dune Combat Calculator</h1>

<div class="layout">

  <!-- Row: headers -->
  <div class="cell-header">Your Faction</div>
  <div class="cell-header">Enemy</div>

  <!-- Row: faction selects -->
  <div class="cell">
    <select id="myFaction">
      <option value="Atreides">Atreides</option>
      <option value="Harkonnen">Harkonnen</option>
      <option value="Fremen">Fremen</option>
      <option value="Emperor">Emperor</option>
      <option value="BeneGesserit">Bene Gesserit</option>
      <option value="SpacingGuild">Spacing Guild</option>
    </select>
  </div>
  <div class="cell">
    <select id="oppFaction">
      <option value="Atreides">Atreides</option>
      <option value="Harkonnen">Harkonnen</option>
      <option value="Fremen">Fremen</option>
      <option value="Emperor">Emperor</option>
      <option value="BeneGesserit">Bene Gesserit</option>
      <option value="SpacingGuild">Spacing Guild</option>
    </select>
  </div>

  <!-- Row: available forces + dialed (yours) | available forces (enemy) -->
  <div class="cell">
    <div class="input-section-title">Available</div>

    <div id="forcesSimple" class="field">
      <label>Forces</label>
      <input type="number" id="forcesNormal" min="0" max="20" value="0">
    </div>
    <div id="forcesElite" class="elite-row hidden">
      <div class="field">
        <label id="eliteLabel">Elite Forces</label>
        <input type="number" id="forcesEliteCount" min="0" max="20" value="0">
      </div>
      <div class="field">
        <label>Normal Forces</label>
        <input type="number" id="forcesNormalElite" min="0" max="20" value="0">
      </div>
    </div>

    <div class="input-section-title" style="margin-top:14px">Dialed</div>
    <div class="field">
      <label>Target Strength (from forces)</label>
      <input type="number" id="dialed" min="0" max="40" step="0.5" value="0">
    </div>
  </div>
  <div class="cell">
    <div class="input-section-title">Available</div>

    <div id="oppForcesSimple" class="field">
      <label>Forces</label>
      <input type="number" id="oppForcesNormal" min="0" max="20" value="0">
    </div>
    <div id="oppForcesElite" class="elite-row hidden">
      <div class="field">
        <label id="oppEliteLabel">Elite Forces</label>
        <input type="number" id="oppForcesEliteCount" min="0" max="20" value="0">
      </div>
      <div class="field">
        <label>Normal Forces</label>
        <input type="number" id="oppForcesNormalElite" min="0" max="20" value="0">
      </div>
    </div>
  </div>

  <!-- Row: leader selection -->
  <div class="cell">
    <div class="input-section-title">Leader</div>
    <div id="leaderButtons" class="leader-grid"></div>
  </div>
  <div class="cell">
    <div class="input-section-title">Leaders</div>
    <div id="oppLeaderButtons" class="leader-grid"></div>
  </div>

  <!-- Row: total strength + remaining | strength range -->
  <div class="cell">
    <div class="section-label">Total Strength (dialed + leader)</div>
    <div id="strengthOutput" class="strength-value">0</div>
    <div class="section-label">Forces Remaining (if victorious)</div>
    <div id="remainingOutput"></div>
  </div>
  <div class="cell">
    <div class="section-label">Strength Range</div>
    <div id="oppStrengthRange"></div>
  </div>

  <!-- Row: abilities | threats -->
  <div class="cell cell-last">
    <div class="section-label">Your Abilities</div>
    <div id="allyReminders"></div>
  </div>
  <div class="cell cell-last">
    <div class="section-label">Opponent Threats</div>
    <div id="threatReminders"></div>
  </div>

</div>

<script>
const FACTIONS = {
  Atreides: {
    hasElite: false,
    leaders: [
      { name: 'Lady Jessica', strength: 5 },
      { name: 'Thufir Hawat', strength: 5 },
      { name: 'Gurney Halleck', strength: 4 },
      { name: 'Duncan Idaho', strength: 2 },
      { name: 'Dr. Yueh', strength: -1 },
    ],
    reminder: 'You may force your opponent to reveal one of: leader, weapon, defense, or dialed number.',
    threat: 'Atreides may force you to reveal your leader, weapon, defense, or dialed number.'
  },
  Harkonnen: {
    hasElite: false,
    leaders: [
      { name: 'Feyd Rautha', strength: 6 },
      { name: 'Beast Rabban', strength: 4 },
      { name: 'Piter DeVries', strength: 3 },
      { name: 'Umman Kudu', strength: 2 },
      { name: 'Nefud', strength: 1 },
    ],
    reminder: 'You may hold up to 8 treachery cards (double the normal limit).',
    threat: 'Harkonnen may hold up to 8 treachery cards — expect more weapons and defenses.'
  },
  Fremen: {
    hasElite: true,
    eliteName: 'Fedaykin',
    eliteStrength: 2,
    noSpice: true,
    leaders: [
      { name: 'Stilgar', strength: 7 },
      { name: 'Chani', strength: 6 },
      { name: 'Otheym', strength: 5 },
      { name: 'Shadout Mapes', strength: 3 },
      { name: 'Jamis', strength: 2 },
    ],
    reminder: 'Your forces do not require spice for full strength. Fedaykin count as 2 strength each.',
    threat: function(myFaction) {
      let t = 'Fremen forces fight at full strength without spice. Fedaykin count as 2 strength each.';
      if (myFaction === 'Emperor') t += ' Your Sardaukar count as 1 (not 2) against Fremen.';
      return t;
    }
  },
  Emperor: {
    hasElite: true,
    eliteName: 'Sardaukar',
    eliteStrength: 2,
    eliteVsFremen: 1,
    leaders: [
      { name: 'Count Fenring', strength: 6 },
      { name: 'Capt. Aramsham', strength: 5 },
      { name: 'Burseg', strength: 3 },
      { name: 'Caid', strength: 3 },
      { name: 'Bashar', strength: 2 },
    ],
    reminder: function(oppFaction) {
      if (oppFaction === 'Fremen') return 'Sardaukar count as only 1 strength each against Fremen (normally 2).';
      return 'Sardaukar count as 2 strength each (but only 1 against Fremen).';
    },
    threat: 'Sardaukar count as 2 strength each. They are weakened to 1 strength against Fremen.'
  },
  BeneGesserit: {
    hasElite: false,
    leaders: [
      { name: 'Alia', strength: 5 },
      { name: 'Lady Margot Fenring', strength: 5 },
      { name: 'Princess Irulan', strength: 5 },
      { name: 'Wanna Marcus', strength: 5 },
      { name: 'Reverend Mother Ramallo', strength: 5 },
    ],
    reminder: 'You may use Voice to require or forbid your opponent from playing a specific type of card.',
    threat: 'Bene Gesserit may use Voice to force or forbid you from playing a specific card type.'
  },
  SpacingGuild: {
    hasElite: false,
    leaders: [
      { name: 'Staban Tuek', strength: 5 },
      { name: 'Esmar Tuek', strength: 3 },
      { name: 'Master Bewt', strength: 3 },
      { name: 'Soo-Soo Suk', strength: 2 },
      { name: 'Guild Representative', strength: 1 },
    ],
    reminder: 'No direct combat strength modification.',
    threat: 'Spacing Guild has no direct combat bonuses.'
  }
};

const $ = id => document.getElementById(id);
let prevDialed = 0;
let selectedLeaderFaction = null;
let selectedLeaderName = null; // null = cheap hero
let oppLeaderFaction = null;
let oppUnavailableLeaders = new Set();

function getLeaderStrength(myFaction) {
  if (selectedLeaderName === null) return 0;
  const l = FACTIONS[myFaction].leaders.find(x => x.name === selectedLeaderName);
  return l ? l.strength : 0;
}

function renderLeaderButtons(myFaction) {
  if (myFaction !== selectedLeaderFaction) {
    selectedLeaderName = null;
    selectedLeaderFaction = myFaction;
  }
  const container = $('leaderButtons');
  const leaders = FACTIONS[myFaction].leaders;
  const cheapSel = selectedLeaderName === null ? ' selected' : '';
  let html = `<button class="leader-btn${cheapSel}" data-name="__cheap__">Cheap Hero <span class="lstr">(0)</span></button>`;
  for (const l of leaders) {
    const sel = selectedLeaderName === l.name ? ' selected' : '';
    const strLabel = l.strength < 0 ? `(${l.strength})` : `(${l.strength})`;
    html += `<button class="leader-btn${sel}" data-name="${l.name}">${l.name} <span class="lstr">${strLabel}</span></button>`;
  }
  container.innerHTML = html;
  container.querySelectorAll('.leader-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.name;
      selectedLeaderName = name === '__cheap__' ? null : name;
      update();
    });
  });
}

function getInputs() {
  const myFaction = $('myFaction').value;
  const oppFaction = $('oppFaction').value;
  const info = FACTIONS[myFaction];
  const hasElite = effectiveHasElite(myFaction, oppFaction);

  let elite = 0, normal = 0;
  if (hasElite) {
    elite = parseInt($('forcesEliteCount').value) || 0;
    normal = parseInt($('forcesNormalElite').value) || 0;
  } else {
    normal = parseInt($('forcesNormal').value) || 0;
  }

  const targetStrength = parseFloat($('dialed').value) || 0;
  const leader = getLeaderStrength(myFaction);

  return { myFaction, oppFaction, info, hasElite, elite, normal, targetStrength, leader };
}

function effectiveHasElite(myFaction, oppFaction) {
  return FACTIONS[myFaction].hasElite && !(myFaction === 'Emperor' && oppFaction === 'Fremen');
}

function getEliteStrength(myFaction, oppFaction) {
  const info = FACTIONS[myFaction];
  if (!info.hasElite) return 1;
  if (myFaction === 'Emperor' && oppFaction === 'Fremen') return info.eliteVsFremen;
  return info.eliteStrength;
}

// Returns array of { eliteCommitted, normalCommitted, spice, eliteRemaining, normalRemaining }
// or null if target is not achievable.
function computeOptions(myFaction, oppFaction, info, elite, normal, D) {
  if (D === 0) {
    return [{ eliteCommitted: 0, normalCommitted: 0, spice: 0, eliteRemaining: elite, normalRemaining: normal }];
  }

  const isFremen = myFaction === 'Fremen';

  if (isFremen) {
    // Fedaykin = 2, Normal = 1, no spice needed
    // 2E + N = D  →  D must be a non-negative integer
    if (!Number.isInteger(D) || D < 0) return null;
    const options = [];
    const E_min = Math.max(0, Math.ceil((D - normal) / 2));
    const E_max = Math.min(elite, Math.floor(D / 2));
    for (let E = E_min; E <= E_max; E++) {
      const N = D - 2 * E;
      if (N >= 0 && N <= normal) {
        options.push({ eliteCommitted: E, normalCommitted: N, spice: 0, eliteRemaining: elite - E, normalRemaining: normal - N });
      }
    }
    return options.length > 0 ? options : null;
  }

  const eliteStr = getEliteStrength(myFaction, oppFaction);

  if (!effectiveHasElite(myFaction, oppFaction)) {
    // Simple faction: each force 0.5 without spice, 1 with spice
    // F forces, S spice: 0.5*(F + S) = D  →  F + S = 2D
    const twoD = 2 * D;
    if (Math.abs(twoD - Math.round(twoD)) > 0.001) return null; // D must be multiple of 0.5
    const twoD_int = Math.round(twoD);
    const options = [];
    for (let F = Math.ceil(D); F <= Math.min(twoD_int, normal); F++) {
      const S = twoD_int - F;
      if (S >= 0 && S <= F) {
        options.push({ eliteCommitted: 0, normalCommitted: F, spice: S, eliteRemaining: 0, normalRemaining: normal - F });
      }
    }
    return options.length > 0 ? options : null;
  }

  // Emperor: elite = eliteStr with spice, eliteStr/2 without; normal = 1/0.5
  // For each (E, N) find minimum spice to hit D exactly.
  const options = [];
  for (let E = 0; E <= elite; E++) {
    for (let N = 0; N <= normal; N++) {
      const minStr = E * (eliteStr / 2) + N * 0.5;
      const maxStr = E * eliteStr + N;
      if (D < minStr - 0.001 || D > maxStr + 0.001) continue;

      // strength gain from spice: each Se adds eliteStr/2 per Sardaukar, each Sn adds 0.5 per normal
      // Se*(eliteStr/2) + Sn*(0.5) = D - minStr = R
      // → Se*eliteStr + Sn = 2R
      const R = D - minStr;
      const twoR = 2 * R;
      let minSpice = Infinity;
      for (let Se = 0; Se <= E; Se++) {
        const sn = twoR - Se * eliteStr;
        if (sn < -0.001) break;
        if (Math.abs(sn - Math.round(sn)) < 0.001) {
          const Sn = Math.round(sn);
          if (Sn >= 0 && Sn <= N) minSpice = Math.min(minSpice, Se + Sn);
        }
      }
      if (minSpice !== Infinity) {
        options.push({ eliteCommitted: E, normalCommitted: N, spice: minSpice, eliteRemaining: elite - E, normalRemaining: normal - N });
      }
    }
  }
  options.sort((a, b) => b.spice - a.spice);
  return options.length > 0 ? options : null;
}

function computeMaxStrength(myFaction, oppFaction, info, elite, normal) {
  if (myFaction === 'Fremen') return 2 * elite + normal;
  if (!info.hasElite) return normal;
  return elite * getEliteStrength(myFaction, oppFaction) + normal;
}

function getAchievableValues(myFaction, oppFaction, info, elite, normal) {
  const max = computeMaxStrength(myFaction, oppFaction, info, elite, normal);
  const values = [0];
  for (let v = 0.5; v <= max + 0.001; v += 0.5) {
    const vr = Math.round(v * 2) / 2;
    const opts = computeOptions(myFaction, oppFaction, info, elite, normal, vr);
    if (opts && opts.length > 0) values.push(vr);
  }
  return values;
}

function renderOppLeaderButtons(oppFaction) {
  if (oppFaction !== oppLeaderFaction) {
    oppUnavailableLeaders.clear();
    oppLeaderFaction = oppFaction;
  }
  const container = $('oppLeaderButtons');
  const leaders = FACTIONS[oppFaction].leaders;
  let html = '';
  for (const l of leaders) {
    const cls = oppUnavailableLeaders.has(l.name) ? ' unavailable' : '';
    html += `<button class="leader-btn${cls}" data-name="${l.name}">${l.name} <span class="lstr">(${l.strength})</span></button>`;
  }
  container.innerHTML = html;
  container.querySelectorAll('.leader-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.name;
      if (oppUnavailableLeaders.has(name)) oppUnavailableLeaders.delete(name);
      else oppUnavailableLeaders.add(name);
      update();
    });
  });
}

function computeEnemyRange(myFaction, oppFaction) {
  const info = FACTIONS[oppFaction];
  let oppElite = 0, oppNormal = 0;
  const oppEffectiveElite = effectiveHasElite(oppFaction, myFaction);
  if (oppEffectiveElite) {
    oppElite = parseInt($('oppForcesEliteCount').value) || 0;
    oppNormal = parseInt($('oppForcesNormalElite').value) || 0;
  } else {
    oppNormal = parseInt($('oppForcesNormal').value) || 0;
  }

  let maxForces;
  if (oppFaction === 'Fremen') {
    maxForces = 2 * oppElite + oppNormal;
  } else if (oppEffectiveElite) {
    maxForces = oppElite * getEliteStrength(oppFaction, myFaction) + oppNormal;
  } else {
    maxForces = oppNormal;
  }

  const available = info.leaders.filter(l => !oppUnavailableLeaders.has(l.name));
  const bestLeader = available.length > 0 ? Math.max(0, ...available.map(l => l.strength)) : 0;

  return { maxForces, bestLeader, max: maxForces + bestLeader };
}

function snapToAchievable(values, D) {
  if (!values.length) return 0;
  return values.reduce((best, v) =>
    Math.abs(v - D) < Math.abs(best - D) ? v : best, values[0]);
}

function update() {
  const { myFaction, oppFaction, info, hasElite, elite, normal, targetStrength, leader } = getInputs();

  // Toggle available forces UI
  $('forcesSimple').classList.toggle('hidden', hasElite);
  $('forcesElite').classList.toggle('hidden', !hasElite);
  if (hasElite) $('eliteLabel').textContent = info.eliteName + ' (Elite)';

  renderLeaderButtons(myFaction);

  // Enemy panel
  const oppInfo = FACTIONS[oppFaction];
  const oppHasElite = effectiveHasElite(oppFaction, myFaction);
  $('oppForcesSimple').classList.toggle('hidden', oppHasElite);
  $('oppForcesElite').classList.toggle('hidden', !oppHasElite);
  if (oppHasElite) $('oppEliteLabel').textContent = oppInfo.eliteName + ' (Elite)';
  renderOppLeaderButtons(oppFaction);
  const range = computeEnemyRange(myFaction, oppFaction);
  $('oppStrengthRange').innerHTML = `
    <div class="opp-range">
      <span>0</span>
      <span class="range-sep">–</span>
      <span>${formatNum(range.max)}</span>
    </div>
    <div class="opp-range-detail">forces up to ${formatNum(range.maxForces)}${range.bestLeader > 0 ? ` &nbsp;+&nbsp; leader up to ${formatNum(range.bestLeader)}` : ''}</div>`;

  const remainingEl = $('remainingOutput');
  const strengthEl = $('strengthOutput');

  const achievable = getAchievableValues(myFaction, oppFaction, info, elite, normal);
  let D = targetStrength;
  let options = computeOptions(myFaction, oppFaction, info, elite, normal, D);
  if (!options) {
    // Snap in the direction of change so spinner buttons cycle forward/backward
    const goingUp = D > prevDialed;
    D = goingUp
      ? (achievable.find(v => v > prevDialed) ?? achievable[achievable.length - 1])
      : ([...achievable].reverse().find(v => v < prevDialed) ?? 0);
    $('dialed').value = D;
    options = computeOptions(myFaction, oppFaction, info, elite, normal, D);
  }
  prevDialed = D;

  strengthEl.textContent = formatNum(D + leader);

  if (!options) {
    remainingEl.innerHTML = '';
  } else if (!hasElite) {
    // Simple faction table: Forces Lost | Spice Needed | Forces Remaining
    let html = '<table class="combo-table">';
    html += '<tr><th class="group-header">Forces Lost</th><th class="group-header">Spice Needed</th><th class="group-header">Forces Remaining</th></tr>';
    for (const o of options) {
      html += `<tr><td>${o.normalCommitted}</td><td class="strength">${o.spice}</td><td>${o.normalRemaining}</td></tr>`;
    }
    html += '</table>';
    remainingEl.innerHTML = html;
  } else {
    // Elite faction table
    const isFremen = myFaction === 'Fremen';
    let html = '<table class="combo-table">';
    if (isFremen) {
      html += '<tr><th class="group-header" colspan="2">Forces Lost</th><th class="group-header" colspan="2">Remaining</th></tr>';
      html += `<tr class="subheader"><th>${info.eliteName}</th><th>Normal</th><th>${info.eliteName}</th><th>Normal</th></tr>`;
      for (const o of options) {
        html += `<tr><td>${o.eliteCommitted}</td><td>${o.normalCommitted}</td><td>${o.eliteRemaining}</td><td>${o.normalRemaining}</td></tr>`;
      }
    } else {
      html += '<tr><th class="group-header" colspan="2">Forces Lost</th><th class="group-header">Spice</th><th class="group-header" colspan="2">Remaining</th></tr>';
      html += `<tr class="subheader"><th>${info.eliteName}</th><th>Normal</th><th>Needed</th><th>${info.eliteName}</th><th>Normal</th></tr>`;
      for (const o of options) {
        html += `<tr><td>${o.eliteCommitted}</td><td>${o.normalCommitted}</td><td class="strength">${o.spice}</td><td>${o.eliteRemaining}</td><td>${o.normalRemaining}</td></tr>`;
      }
    }
    html += '</table>';
    remainingEl.innerHTML = html;
  }

  // Reminders
  $('allyReminders').innerHTML = renderReminder(typeof FACTIONS[myFaction].reminder === 'function' ? FACTIONS[myFaction].reminder(oppFaction) : FACTIONS[myFaction].reminder, 'ally');
  const threat = FACTIONS[oppFaction].threat;
  $('threatReminders').innerHTML = renderReminder(typeof threat === 'function' ? threat(myFaction) : threat, 'threat');
}

function formatNum(n) {
  return n % 1 === 0 ? n.toString() : n.toFixed(1);
}

function renderReminder(text, type) {
  return `<div class="reminder reminder-${type === 'ally' ? 'ally' : 'threat'}">${text}</div>`;
}

// Bind all inputs
document.querySelectorAll('select, input').forEach(el => {
  el.addEventListener('input', update);
  el.addEventListener('change', update);
});

// Arrow keys on dialed input cycle through achievable values only
$('dialed').addEventListener('keydown', e => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const { myFaction, oppFaction, info, elite, normal } = getInputs();
  const current = parseFloat($('dialed').value) || 0;
  const achievable = getAchievableValues(myFaction, oppFaction, info, elite, normal);
  const idx = achievable.findIndex(v => Math.abs(v - current) < 0.001);
  if (e.key === 'ArrowUp' && idx < achievable.length - 1) $('dialed').value = achievable[idx + 1];
  else if (e.key === 'ArrowDown' && idx > 0) $('dialed').value = achievable[idx - 1];
  update();
});

update();
</script>
</body>
</html>
